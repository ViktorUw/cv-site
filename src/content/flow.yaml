# The automation diagram in the Hero section, drawn left to right
# (top to bottom on phones). Keep it to 4–5 nodes so it stays readable.
# kind: trigger (where it starts), step, result (what the client gets)
# tool: the small label above each node (app or service name)

- id: inquiry
  kind: trigger
  en: { tool: Web form, label: New inquiry arrives }
  pl: { tool: Formularz, label: Wpływa nowe zapytanie }

- id: classify
  kind: step
  en: { tool: AI, label: AI sorts it and drafts a reply }
  pl: { tool: AI, label: AI je kategoryzuje i szkicuje odpowiedź }

- id: crm
  kind: step
  en: { tool: CRM, label: Contact is saved to the CRM }
  pl: { tool: CRM, label: Kontakt trafia do CRM }

- id: notify
  kind: result
  en: { tool: Slack, label: The right person gets a ready task }
  pl: { tool: Slack, label: Właściwa osoba dostaje gotowe zadanie }
