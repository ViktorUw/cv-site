en:
  location: Wrocław, Poland
  role: AI automation and Python developer
  headline: I automate repetitive work in your business with Make, n8n and Zapier.
  intro: >-
    Requests that sort themselves, data that moves between your tools without
    copy-pasting, reports that arrive on time. You describe the routine, I build
    the workflow that takes it off your plate.
  photoAlt: Portrait of Viktor Vasylyshyn
  about:
    - >-
      I'm Viktor. In 2026 I graduated from the University of Wrocław with a
      degree in Applied Computer Science and Measurement Systems. My diploma
      project was Gym Tracker, a mobile app that logs workouts without an
      internet connection.
    - >-
      Studying measurement left me with a habit: before changing a process, I
      look for where the information comes from and where it gets lost. In small
      teams it usually gets lost between tools, in a spreadsheet someone updates
      by hand or an email nobody forwarded. Automation is how I fix that.
    - >-
      I'm starting my career in IT now, so there's no long list of past clients
      here yet. What you get instead is my full attention on your project, and
      enough Python, Docker and CI/CD to write the missing piece myself when a
      ready-made integration falls short.
  seoTitle: Viktor Vasylyshyn | AI automation with Make, n8n and Zapier
  seoDescription: >-
    I build AI automations with Make, n8n and Zapier that take repetitive work
    off small teams. Python developer based in Wrocław, Poland.

pl:
  location: Wrocław, Polska
  role: Automatyzacje AI i Python
  headline: Automatyzuję powtarzalną pracę w Twojej firmie za pomocą Make, n8n i Zapier.
  intro: >-
    Zgłoszenia, które same trafiają tam, gdzie trzeba, dane przenoszone między
    narzędziami bez kopiowania, raporty gotowe na czas. Opisujesz rutynę, a ja
    buduję proces, który zdejmie ją z Twojej głowy.
  photoAlt: Portret Viktora Vasylyshyna
  about:
    - >-
      Nazywam się Viktor. W 2026 roku ukończyłem informatykę stosowaną i systemy
      pomiarowe na Uniwersytecie Wrocławskim. Moim projektem dyplomowym był Gym
      Tracker, aplikacja mobilna do zapisywania treningów, która działa bez
      internetu.
    - >-
      Studia z systemów pomiarowych zostawiły mi nawyk: zanim zmienię proces,
      sprawdzam, skąd pochodzą informacje i gdzie się gubią. W małych zespołach
      zwykle gubią się między narzędziami, w arkuszu aktualizowanym ręcznie albo
      w mailu, którego nikt nie przekazał dalej. Automatyzacja to mój sposób,
      żeby to naprawić.
    - >-
      Właśnie zaczynam karierę w IT, więc nie znajdziesz tu jeszcze długiej listy
      klientów. Zamiast tego dostajesz moją pełną uwagę przy Twoim projekcie i
      wystarczająco dużo Pythona, Dockera i CI/CD, żeby samodzielnie dopisać
      brakujący element, gdy gotowa integracja nie wystarcza.
  seoTitle: Viktor Vasylyshyn | Automatyzacje AI w Make, n8n i Zapier
  seoDescription: >-
    Buduję automatyzacje AI w Make, n8n i Zapier, które zdejmują powtarzalną
    pracę z małych zespołów. Programista Python z Wrocławia.
